{% extends "base.html" %}
{% block title %}Proyek Baru{% endblock %}
{% block content %}
<section class="hero">
    <div>
        <h1>Proyek Baru</h1>
        <p class="muted">Buat proyek baru di bawah salah satu unit.</p>
    </div>
</section>

<section class="panel narrow">
    <form method="post" class="form">
        <label>Unit
            <select name="unit_id" required>
                <option value="">-- Pilih Unit --</option>
                {% for u in units %}
                <option value="{{ u.id }}">{{ u.name }}</option>
                {% endfor %}
            </select>
        </label>
        <div class="row">
            <label>Kode Proyek
                <input name="code" required placeholder="PRJ-XXX">
            </label>
            <label>Nama Proyek
                <input name="name" required>
            </label>
        </div>
        <label>Penanggung Jawab (PIC)
            <input name="pic">
        </label>
        <label>Deskripsi
            <textarea name="description" rows="4"></textarea>
        </label>
        <div class="actions">
            <button class="btn btn-primary" type="submit">Simpan Proyek</button>
            <a class="btn btn-ghost" href="{{ url_for('projects') }}">Batal</a>
        </div>
    </form>
</section>
{% endblock %}
